[poster]
layout      = "gallery"
size        = "A3"            # "A4" (proofs), "A3", or any "<w>x<h>" in cm, e.g. "50x70"
# dpi       = 300             # optional; defaults to 300 for A4/A3 and 150 for bigger formats
orientation = "auto"          # "auto" follows the photo; or "portrait" / "landscape"
title       = "Retro"
title_width = 1.0             # fraction of the content width the title fills
photo       = "photos/my_photo.jpg"
focus       = [0.5, 0.5]      # which part of the photo stays in frame if a crop is needed
paper       = "#e9e6df"
ink         = "#1d1d1f"
# spotify   = "https://open.spotify.com/track/4cOdK2wGLETKBW3PvgPWqT"  # Spotify code (downloaded once, cached in assets/spotify)
url         = "https://example.com"  # QR code, used when `spotify` is not set
# paper_texture = "photos/paper.jpg" # optional scanned paper; the paper is generated by default

info = [
  { label = "Title",   value = "Retro" },
  { label = "Date",    value = "22/11/26" },
  { label = "Place",   value = "Paris" },
  { label = "Photo",   value = "Max" },
  { label = "Edition", value = "No. 001" },
]

[effects]
saturation = 0.85
contrast   = 0.92
warmth     = 0.05
fade       = 0.06
grain      = 10       # film grain strength (0 = off)
texture    = 1.0      # paper texture strength (0 = flat paper)
creases    = 3        # number of soft paper creases

[fonts]
title = "fonts/Jost-ExtraBold.ttf"
label = "fonts/Inter-Bold.ttf"
mono  = "fonts/IBMPlexMono-Regular.ttf"
