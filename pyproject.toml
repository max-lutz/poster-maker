[project]
name = "poster-maker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "qrcode>=7.4",
]

[dependency-groups]
dev = [
    "fonttools>=4.68.0",
    "opencv-python-headless>=5.1.0.95",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
